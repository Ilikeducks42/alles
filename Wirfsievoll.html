<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Wurf</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,sans-serif;color:#fff}
video,canvas{position:fixed;inset:0;width:100%;height:100%}
video{object-fit:cover;background:#111}
canvas{touch-action:none}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:6px;padding:6px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:24px;z-index:3}
#bar button{width:54px;height:54px;font-size:28px;border:0;border-radius:18px;background:transparent;transition:transform .12s,background .12s;padding:0}
#bar button.on{background:rgba(255,255,255,.22);transform:translateY(-6px) scale(1.08)}
#bar .sep{width:1px;background:rgba(255,255,255,.25);margin:8px 2px}
#flip,#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;width:44px;height:44px;border:0;border-radius:50%;font-size:20px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:3;color:#fff}
#tr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 22px);left:14px;font-size:13px;padding:6px 12px;border-radius:14px;background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:3;transition:opacity .6s;max-width:60vw}
#flip{right:14px}#snd{right:66px}
#start{position:fixed;inset:0;z-index:5;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
#start .big{font-size:84px}
#start p{margin:0;opacity:.7;max-width:280px;line-height:1.4}
#start button{font-size:18px;font-weight:600;padding:14px 28px;border:0;border-radius:30px;background:#fff;color:#111}
</style></head><body>
<video id="v" playsinline muted autoplay></video>
<canvas id="st"></canvas><canvas id="fx"></canvas>
<button id="flip" aria-label="Kamera wechseln">🔄</button><button id="snd" aria-label="Ton">🔊</button><div id="tr" style="opacity:0"></div>
<div id="bar"></div>
<div id="start"><div class="big">🍅</div><p id="msg">Wähle unten ein Wurfobjekt und wische auf den Bildschirm.</p><button id="go">Kamera starten</button></div>
<script>
const $=s=>document.querySelector(s),v=$('#v'),st=$('#st'),fx=$('#fx'),sx=st.getContext('2d'),fc=fx.getContext('2d');
const R=Math.random,dpr=Math.min(devicePixelRatio||1,3);
let W,H;
function size(){W=innerWidth;H=innerHeight;for(const c of[st,fx]){c.width=W*dpr;c.height=H*dpr}sx.setTransform(dpr,0,0,dpr,0,0);fc.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',size);

const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
function blob(g,x,y,r,col,n=16,j=.3){const p=[];for(let i=0;i<n;i++){const a=i/n*6.283,k=r*(1-j/2+R()*j);p.push([x+Math.cos(a)*k,y+Math.sin(a)*k])}
 g.fillStyle=col;g.beginPath();g.moveTo(...mid(p[n-1],p[0]));for(let i=0;i<n;i++){const e=mid(p[i],p[(i+1)%n]);g.quadraticCurveTo(p[i][0],p[i][1],e[0],e[1])}g.closePath();g.fill()}
function drops(g,m,r,col,n=14){g.strokeStyle=col;g.lineCap='round';for(let i=0;i<n;i++){const a=R()*6.283,d=r*(1.1+R()*1.3),rr=r*(.05+R()*.13),x=m+Math.cos(a)*d,y=m+Math.sin(a)*d;
 if(R()<.5){g.lineWidth=rr*1.3;g.beginPath();g.moveTo(m+Math.cos(a)*r*.8,m+Math.sin(a)*r*.8);g.lineTo(x,y);g.stroke()}
 blob(g,x,y,rr*1.6,col,8,.3)}}
const items=[
 {e:'🍅',s:84,sp:{f:2500,d:.3,o:140},paint(g,m,r){blob(g,m,m,r,'#b81f17');blob(g,m+r*.1,m,r*.7,'#d9392a');drops(g,m,r,'#b81f17');g.fillStyle='#f3d98a';for(let i=0;i<6;i++){g.beginPath();g.ellipse(m+(R()-.5)*r,m+(R()-.5)*r,r*.07,r*.04,R()*3,0,6.3);g.fill()}}},
 {e:'🥚',s:78,sp:{f:5000,d:.22,o:200,c:1},paint(g,m,r){blob(g,m,m,r*1.1,'rgba(255,255,255,.88)',18,.4);drops(g,m,r,'rgba(255,255,255,.88)',12);blob(g,m,m,r*.38,'#f4b315',12,.2);blob(g,m-r*.1,m-r*.1,r*.1,'rgba(255,255,255,.6)',8,.1)}},
 {e:'🎨',s:100,sp:{f:1800,d:.45,o:110},paint(g,m,r){const c=`hsl(${R()*360|0} 85% 55%)`;blob(g,m,m,r*1.05,c,20,.45);drops(g,m,r,c,18)}},
 {e:'🥧',s:110,sp:{f:1200,d:.35,o:90},paint(g,m,r){blob(g,m,m,r*1.1,'#fff7ea',18,.4);blob(g,m+r*.1,m-r*.1,r*.6,'#fff',14,.3);drops(g,m,r,'#fff7ea',14)}}
];
const bar=$('#bar');let sel=0;
items.forEach((it,i)=>{const b=document.createElement('button');b.textContent=it.e;b.onclick=()=>{sel=i;[...bar.querySelectorAll('button')].forEach((x,k)=>x.classList.toggle('on',k===i));navigator.vibrate&&navigator.vibrate(8);snd('tick')};bar.append(b)});
bar.firstChild.classList.add('on');
const sep=document.createElement('div');sep.className='sep';bar.append(sep);
const clr=document.createElement('button');clr.textContent='🧽';clr.onclick=()=>{sx.clearRect(0,0,W,H);pops.length=0;stuck.length=0;snd('tick');navigator.vibrate&&navigator.vibrate(20)};bar.append(clr);

function sprite(it){const S=it.s*(.85+R()*.3),D=Math.ceil(S*3.4),c=document.createElement('canvas');c.width=c.height=D*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);
 g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=8;it.paint(g,D/2,S/2);c.D=D;return c}

const fly=[],pops=[],stuck=[];let run=false;
// ---- Sound
let ac,mute=false;
function noise(d){const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=R()*2-1;const n=ac.createBufferSource();n.buffer=b;return n}
function env(node,t,peak,d){const g=ac.createGain();g.gain.setValueAtTime(peak,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);node.connect(g).connect(ac.destination);return g}
function snd(k,sp){if(!ac||mute)return;const t=ac.currentTime;
 if(k==='tick'){const o=ac.createOscillator();o.frequency.value=900;env(o,t,.15,.05);o.start(t);o.stop(t+.06)}
 else if(k==='whoosh'){const n=noise(.35),f=ac.createBiquadFilter(),g=ac.createGain();f.type='bandpass';f.Q.value=1.5;f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(2200,t+.3);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.15);g.gain.exponentialRampToValueAtTime(.0001,t+.34);n.connect(f).connect(g).connect(ac.destination);n.start(t)}
 else{const v=.8+R()*.4,n=noise(sp.d),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(sp.f*v,t);f.frequency.exponentialRampToValueAtTime(200,t+sp.d);n.connect(f);env(f,t,.8,sp.d);n.start(t);
  const o=ac.createOscillator();o.frequency.setValueAtTime(sp.o*v,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);env(o,t,.9,.18);o.start(t);o.stop(t+.2);
  if(sp.c){const c=noise(.03),h=ac.createBiquadFilter();h.type='highpass';h.frequency.value=3000;c.connect(h);env(h,t,.6,.03);c.start(t)}}}
// ---- Tracking
const BONES=[[11,12,.35],[33,34,.9],[11,13,.3],[13,15,.28],[12,14,.3],[14,16,.28],[23,25,.45],[25,27,.38],[24,26,.45],[26,28,.38],[35,33,.6]];
let body=null,pl,lastT=-1,lastSeen=0;
function map(l){const vw=v.videoWidth,vh=v.videoHeight,sc=Math.max(W/vw,H/vh);let x=l.x*vw*sc+(W-vw*sc)/2;if(facing==='user')x=W-x;return{x,y:l.y*vh*sc+(H-vh*sc)/2}}
function track(){requestAnimationFrame(track);if(!pl||v.readyState<2||!v.videoWidth||v.currentTime===lastT)return;lastT=v.currentTime;
 let r;try{r=pl.detectForVideo(v,performance.now());failCount=0}catch(e){if(++failCount>30&&!loading){loading=1;loadTracker()}return}
 const lm=r.landmarks&&r.landmarks[0],now=performance.now();
 if(!lm||lm[11].visibility<.3||lm[12].visibility<.3){if(now-lastSeen>600){body=null;status('Keine Person erkannt')}return}
 lastSeen=now;status('Person erkannt');
 const p=lm.map((l,i)=>{const q=map(l),o=body&&body.p[i];return{x:o?o.x+(q.x-o.x)*.55:q.x,y:o?o.y+(q.y-o.y)*.55:q.y,v:l.visibility??1}});
 const L=p[11],Rr=p[12],s=Math.max(40,Math.hypot(L.x-Rr.x,L.y-Rr.y)),ms={x:(L.x+Rr.x)/2,y:(L.y+Rr.y)/2,v:1};
 let hp={x:(p[23].x+p[24].x)/2,y:(p[23].y+p[24].y)/2,v:Math.min(p[23].v,p[24].v)};
 if(hp.v<.3){let dx=Rr.y-L.y,dy=L.x-Rr.x;if(dy<0){dx=-dx;dy=-dy}const l=Math.hypot(dx,dy)||1;hp={x:ms.x+dx/l*s*1.8,y:ms.y+dy/l*s*1.8,v:1}}
 const hd=(p[7].v>.3&&p[8].v>.3)?{x:(p[7].x+p[8].x)/2,y:(p[7].y+p[8].y)/2,v:1}:{...p[0],v:p[0].v};
 p[33]=ms;p[34]=hp;p[35]=hd;body={p,s}}
function attach(x,y){if(!body)return null;let best=null,bs=1.15;
 for(let i=0;i<BONES.length;i++){const[a,b,r]=BONES[i],A=body.p[a],B=body.p[b];if(!A||!B||A.v<.3||B.v<.3)continue;
  const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,t=Math.max(0,Math.min(1,((x-A.x)*ux+(y-A.y)*uy)/L)),px=A.x+dx*t,py=A.y+dy*t,d=Math.hypot(x-px,y-py)/(r*body.s);
  if(d<bs){bs=d;best={i,t,o1:((x-px)*ux+(y-py)*uy)/body.s,o2:(-(x-px)*uy+(y-py)*ux)/body.s,s0:body.s}}}
 return best}
function apos(an){if(!body)return null;const[a,b]=BONES[an.i],A=body.p[a],B=body.p[b];if(!A||!B)return null;
 const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,px=A.x+dx*an.t,py=A.y+dy*an.t,s=body.s;
 return{x:px+ux*an.o1*s-uy*an.o2*s,y:py+uy*an.o1*s+ux*an.o2*s,k:s/an.s0}}
let trackOn=0,failCount=0;
const tr=$('#tr');function status(t,fail){if(tr.textContent!==t)tr.textContent=t;tr.style.opacity=1;tr.dataset.fail=fail?1:''}
tr.onclick=()=>{if(tr.dataset.fail&&!loading){loading=1;loadTracker()}};
const wait=(p,ms)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),ms))]);
const LIBS=['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14','https://unpkg.com/@mediapipe/tasks-vision@0.10.14'];
const MODEL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
async function loadTracker(){status('Tracking lädt …');pl=null;let err;
 for(const B of LIBS){try{
  const m=await wait(import(B+'/vision_bundle.mjs'),20000),fs=await wait(m.FilesetResolver.forVisionTasks(B+'/wasm'),20000);
  const mk=d=>wait(m.PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.4,minPosePresenceConfidence:.4,minTrackingConfidence:.4}),30000);
  let p=null;
  try{p=await mk('GPU');p.detectForVideo(v,performance.now())}catch(e){try{p&&p.close()}catch(_){}p=await mk('CPU');p.detectForVideo(v,performance.now())}
  pl=p;loading=0;status('Keine Person erkannt');if(!trackOn){trackOn=1;requestAnimationFrame(track)}return
 }catch(e){err=e}}
 loading=0;status('Tracking fehlgeschlagen – tippen für neuen Versuch',1)}
// ---- Wurf
function throwItem(x1,y1){const it=items[sel];fly.push({it,x0:W/2,y0:H-60,x1,y1,t:performance.now(),spr:sprite(it),rot:(R()-.5)*8});snd('whoosh');kick()}
function kick(){if(!run){run=true;requestAnimationFrame(loop)}}
function loop(now){fc.clearRect(0,0,W,H);
 for(const q of stuck){const a=apos(q.an);if(a){const D=q.spr.D*a.k;fc.drawImage(q.spr,a.x-D/2,a.y-D/2,D,D)}}
 for(let i=fly.length-1;i>=0;i--){const f=fly[i],p=Math.min(1,(now-f.t)/340),e=1-(1-p)*(1-p),x=f.x0+(f.x1-f.x0)*e,y=f.y0+(f.y1-f.y0)*e-Math.sin(p*Math.PI)*70,sz=f.it.s*(1-.6*e);
  fc.save();fc.translate(x,y);fc.rotate(f.rot*p);fc.font=`${sz}px serif`;fc.textAlign='center';fc.textBaseline='middle';fc.fillText(f.it.e,0,0);fc.restore();
  if(p>=1){fly.splice(i,1);pops.push({x:f.x1,y:f.y1,spr:f.spr,t:now,an:attach(f.x1,f.y1)});snd('hit',f.it.sp);navigator.vibrate&&navigator.vibrate(15)}}
 for(let i=pops.length-1;i>=0;i--){const q=pops[i],p=Math.min(1,(now-q.t)/200),k=p<1?1+2.2*Math.pow(p-1,3)+1.2*Math.pow(p-1,2):1,a=q.an?apos(q.an):{x:q.x,y:q.y,k:1};
  if(p>=1){pops.splice(i,1);if(q.an){stuck.push(q);if(stuck.length>60)stuck.shift()}else sx.drawImage(q.spr,q.x-q.spr.D/2,q.y-q.spr.D/2,q.spr.D,q.spr.D)}
  else if(a){const D=q.spr.D*k*a.k;fc.drawImage(q.spr,a.x-D/2,a.y-D/2,D,D)}}
 if(fly.length||pops.length||stuck.length)requestAnimationFrame(loop);else run=false}

const ptr={};
fx.addEventListener('pointerdown',e=>{fx.setPointerCapture(e.pointerId);ptr[e.pointerId]=[{x:e.clientX,y:e.clientY,t:e.timeStamp}]});
fx.addEventListener('pointermove',e=>{const a=ptr[e.pointerId];if(a){a.push({x:e.clientX,y:e.clientY,t:e.timeStamp});if(a.length>8)a.shift()}});
const endp=e=>{const a=ptr[e.pointerId];if(!a)return;delete ptr[e.pointerId];
 let x=e.clientX,y=e.clientY;const l=a[a.length-1],f=a.find(p=>l.t-p.t<90)||a[0],dt=l.t-f.t;
 if(dt>10){const vx=(l.x-f.x)/dt,vy=(l.y-f.y)/dt;if(Math.hypot(vx,vy)>.6){x+=vx*140;y+=vy*140}}
 throwItem(Math.max(20,Math.min(W-20,x)),Math.max(20,Math.min(H-120,y)))};
fx.addEventListener('pointerup',endp);fx.addEventListener('pointercancel',e=>delete ptr[e.pointerId]);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

let facing='environment',stream,loading=0;
async function cam(){try{stream&&stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
 body=null;lastT=-1;v.srcObject=stream;v.style.transform=facing==='user'?'scaleX(-1)':'';await v.play();$('#start').style.display='none';if(!pl&&!loading&&!trackOn){loading=1;loadTracker()}}
 catch(err){$('#msg').textContent=location.protocol==='file:'||(!isSecureContext)?'Kamera braucht https oder localhost. Öffne die App über einen Webserver.':'Kamerazugriff nicht möglich. Erlaube die Kamera in den Browser-Einstellungen.';$('#go').textContent='Nochmal versuchen';$('#start').style.display='flex'}}
$('#go').onclick=()=>{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();cam()};
$('#snd').onclick=e=>{mute=!mute;e.target.textContent=mute?'🔇':'🔊';snd('tick')};
$('#flip').onclick=()=>{facing=facing==='user'?'environment':'user';cam()};
</script></body></html>
